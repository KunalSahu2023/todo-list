spring.application.name=todo-list

# Configure MySQL Database Connection

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://localhost:3306/todo_list
spring.datasource.username=root
spring.datasource.password=root

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==============================
# JWT
# ==============================
jwt.secret=7f3c9a2e8b1d4f6a9c5e7b3d1a8f2c6e4b9d7a1c5f8e3b6d2a9c4f7e1b5d8

# 1 hour
jwt.expiration=360000

# Logging
logging.level.todolist=DEBUG
logging.level.org.springframework.web=DEBUG
