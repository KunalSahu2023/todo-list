spring.application.name=todo-list

# Configure MySQL Database Connection

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:todo_list}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ==============================
# Redis
# ==============================

#from
#spring.data.redis.host=todo-redis
#spring.data.redis.port=6379

#to
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

#rate limiting
rate-limit.login.max-requests=5
rate-limit.login.window-seconds=60

# ==============================
# JWT
# ==============================
jwt.secret= ocD8jBsrb3e1hjnZyAb6I2sSam+pCsFdRbz8JEtLnU54BbRzmID33jTgkFRtDQ6CG8ahkn9RHCmmJMyHBFfFWQ==

# 24 hours
jwt.expiration=84600000

# Logging
logging.level.todolist=DEBUG
logging.level.org.springframework.web=DEBUG

#rabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}






