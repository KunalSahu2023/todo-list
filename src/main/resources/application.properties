spring.application.name=todo-list

# ==============================
# Server
# ==============================
server.port=${PORT:8080}

# ==============================
# POSTGreSQL Database
# ==============================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todo_list}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:kunal@321}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# Hibernate / JPA
# ==============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==============================
# Redis
# ==============================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==============================
# Rate Limiting
# ==============================

rate-limit.login.max-requests=5
rate-limit.login.window-seconds=60

# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET:change-this-local-secret}
#jwt.secret=${JWT_SECRET:local-development-secret-change-me}
jwt.expiration=84600000

# ===============================
# Logging
# ===============================
logging.level.com.developer.todolist=DEBUG
logging.level.org.springframework.web=DEBUG

# ==============================
# RabbitMQ
# ==============================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==============================
# Kafka
# ==============================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}



