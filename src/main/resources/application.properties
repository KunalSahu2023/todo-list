spring.application.name=todo-list

# Enable the H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configure H2 In-Memory Database Connection
#spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.url=jdbc:h2:file:./data/todolist
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password= kunal123

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==============================
# JWT
# ==============================

jwt.secret=MyVerySecretKeyForTodoApplicationJwtAuthentication2026SecureKey

# 1 hour
jwt.expiration=3600000

logging.level.org.springframework.security=DEBUG

#logging.level.org.springframework.security=INFO